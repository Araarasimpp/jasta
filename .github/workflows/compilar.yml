name: Compilar

# Compila la app en cada push. En main, además deja la versión lista para Hostinger
# en la rama "hostinger" (solo los archivos compilados), que Hostinger descarga con
# su despliegue por Git en app.jastatechnology.com.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx ng build

      - name: Publicar en la rama hostinger
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          test -f www/index.html && test -f www/.htaccess
          cd www
          git init -q -b hostinger
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "App compilada desde ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" hostinger
