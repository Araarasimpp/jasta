<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Jasta</title>
  <base href="/" />
  <!-- Aviso de "Nueva versión": al publicar se pone aquí la última novedad (scripts/marca-aviso.mjs).
       El aviso solo sale cuando cambia, así que publicar sin novedad no molesta a nadie. -->
  <meta name="jasta-aviso" content="dev" />
  <link rel="manifest" href="manifest.json" />
  <!-- Conexión anticipada al servidor de datos: la primera consulta responde antes -->
  <link rel="preconnect" href="https://ktksdoedeazkvohewqzx.supabase.co" crossorigin />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />
  <link rel="apple-touch-icon" href="assets/icon/logo-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Jasta" />
  <!-- Pantalla de carga (se ve al instante, antes de que cargue la app) -->
  <style>
    /* Fondo índigo con un brillo al centro; el logo aparece, luego el lema; al final se abre un círculo desde el centro */
    @property --cg-r { syntax: '<length>'; inherits: false; initial-value: 0px; }
    #carga { position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center; overflow: hidden;
      background: radial-gradient(70% 45% at 50% 46%, #6366f1 0%, #4f46e5 38%, #3730a3 100%);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #fff;
      -webkit-mask: radial-gradient(circle at 50% 50%, transparent calc(var(--cg-r) - 2px), #000 var(--cg-r));
      mask: radial-gradient(circle at 50% 50%, transparent calc(var(--cg-r) - 2px), #000 var(--cg-r)); }
    #carga::before { content: ''; position: absolute; inset: 0; background: radial-gradient(40% 28% at 50% 46%, rgba(255,255,255,.16), transparent 70%);
      animation: cg-brillo 2.6s ease-in-out infinite alternate; }
    #carga .cg-centro { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; transition: opacity 260ms ease, transform 260ms ease; }
    #carga .cg-marca { display: flex; align-items: center; gap: 12px; animation: cg-entra 700ms cubic-bezier(.2, .8, .2, 1) 350ms both; }
    #carga .cg-logo { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 14px; background: #fff; box-shadow: 0 8px 22px rgba(20,16,80,.35); }
    #carga .cg-logo img { width: 36px; height: 36px; object-fit: contain; }
    #carga .cg-nombre { font-size: 38px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
    #carga p { margin: 0; font-size: 13px; letter-spacing: .02em; color: rgba(255,255,255,.72); animation: cg-aparece 600ms ease 1050ms both; }
    /* Al terminar: se apaga el logo y la app aparece por un círculo que crece desde el centro */
    #carga.sale .cg-centro { opacity: 0; transform: scale(.96); }
    #carga.abre { --cg-r: 150vmax; transition: --cg-r 750ms cubic-bezier(.65, 0, .35, 1); pointer-events: none; }
    @keyframes cg-entra { from { opacity: 0; transform: scale(.9); filter: blur(6px); } }
    @keyframes cg-aparece { from { opacity: 0; transform: translateY(4px); } }
    @keyframes cg-brillo { to { opacity: .55; transform: scale(1.15); } }
    @media (prefers-reduced-motion: reduce) {
      #carga *, #carga, #carga::before { animation-duration: 1ms !important; animation-delay: 0s !important; }
      #carga.abre { transition: opacity 200ms !important; opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="carga" role="status" aria-label="Cargando Jasta">
    <div class="cg-centro">
      <div class="cg-marca"><span class="cg-logo"><img src="assets/icon/logo.png" alt="" /></span><span class="cg-nombre">Jasta</span></div>
      <p>Hobbies y accesorios, tus pedidos en orden</p>
    </div>
  </div>
  <script>
    (function () {
      var el = document.getElementById('carga');
      var inicio = Date.now();
      // Las páginas de los clientes (catálogo, seguimiento, pago) entran sin pantalla de carga
      if (/^\/(tienda|seguimiento|pago)(\/|$)/.test(location.pathname)) { el.remove(); window.jastaLista = function () {}; return; }
      var listo = false;
      // La app avisa cuando arrancó; se muestra al menos 2,2 s para que se vea la animación
      window.jastaLista = function () {
        if (listo) return;
        listo = true;
        setTimeout(function () {
          el.classList.add('sale');
          setTimeout(function () {
            // Sin @property (navegadores viejos) el círculo no se anima: se desvanece
            if (!(window.CSS && CSS.registerProperty)) { el.style.transition = 'opacity 400ms ease'; el.style.opacity = '0'; }
            el.classList.add('abre');
            setTimeout(function () { el.remove(); }, 850);
          }, 260);
        }, Math.max(0, 2200 - (Date.now() - inicio)));
      };
      // Por si algo falla, nunca se queda pegada
      setTimeout(window.jastaLista, 9000);
    })();
  </script>
  <app-root></app-root>
</body>
</html>
